name: Supabase Keep Alive

on:
  schedule:
    # 每天 UTC 01:00 執行一次（台灣時間早上 09:00）
    - cron: "0 1 * * *"
  # 允許在 GitHub Actions 頁面手動執行，方便測試
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # anon key（eyJ... 開頭）或 publishable key（sb_publishable_ 開頭）都可以
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          # 最多重試 3 次，避免偶發的網路問題造成失敗
          for i in 1 2 3; do
            status=$(curl -s -o response.json -w "%{http_code}" \
              "$SUPABASE_URL/rest/v1/keep_alive?select=id&limit=1" \
              -H "apikey: $SUPABASE_KEY")

            echo "第 $i 次嘗試：HTTP $status"
            cat response.json; echo

            if [ "$status" = "200" ]; then
              echo "✅ Supabase 查詢成功"
              exit 0
            fi

            sleep 30
          done

          echo "::error::Supabase 查詢失敗，請到 Dashboard 確認專案狀態"
          exit 1
