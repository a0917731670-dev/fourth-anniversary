name: Supabase Keep Alive

on:
  schedule:
    - cron: '17 3 * * *' # 每天 UTC 03:17（台北時間 11:17）
  workflow_dispatch: # 也可以手動執行

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/out -w '%{http_code}' --max-time 30 \
              "$SUPABASE_URL/rest/v1/keep_alive?select=id&limit=1" \
              -H "apikey: $SUPABASE_KEY")
            echo "第 $i 次嘗試：HTTP $code"
            cat /tmp/out; echo
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          exit 1
